name: Android CI (Telegram Build)

on:
  push:
    branches: [ "rewrite" ]
  pull_request:
    branches: [ "rewrite" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false # Hata veren gizli modülleri kapattık

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace # Hata ayıklama için debug sürümü deniyoruz

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
